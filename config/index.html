<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MakersOnStream</title>
<style>
:root {
  --bg: #0f1114;
  --surface: #1a1d22;
  --field: #242830;
  --text: #f4f5f7;
  --muted: #9aa3b2;
  --line: rgba(255,255,255,0.08);
  --accent: #e23d28;
  --accent2: #3d9bff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 80% at 10% -10%, rgba(226,61,40,0.22), transparent 55%),
    radial-gradient(90% 60% at 100% 0%, rgba(61,155,255,0.16), transparent 50%),
    var(--bg);
}
.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
button, input, select { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
.hero { padding: 28px 4px 10px; }
.brand {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(226,61,40,0.2); }
.hero h1 { margin: 10px 0 0; font-size: 28px; letter-spacing: -0.03em; }
.hero p { margin: 6px 0 0; color: var(--muted); font-size: 15px; }
h2 {
  margin: 22px 4px 10px; font-size: 12px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.group {
  background: var(--surface); border-radius: 18px; border: 1px solid var(--line); overflow: hidden;
}
.row { padding: 14px 16px; }
.row + .row { border-top: 1px solid var(--line); }
label.field { display: block; }
label.field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
input[type=text], input[type=password] {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--field); outline: none;
}
input:focus { border-color: rgba(61,155,255,0.5); }
.seg { display: flex; background: var(--field); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; padding: 10px 8px; border-radius: 10px; font-size: 14px; color: var(--muted); }
.seg button.on { background: #2c313b; color: var(--text); font-weight: 700; }
.hint { margin: 10px 4px 0; color: var(--muted); font-size: 13px; }
.hint a { color: var(--accent2); }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--bg) 28%);
}
.save {
  width: 100%; max-width: 560px; margin: 0 auto; display: block;
  padding: 15px; border-radius: 16px; font-weight: 700; font-size: 16px;
  background: var(--accent); color: #fff;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand"><span class="dot"></span> MakersOnStream</div>
    <h1>Watch settings</h1>
    <p>See who’s live and what’s coming up on your Pebble.</p>
  </div>

  <h2>Show</h2>
  <div class="group">
    <div class="row">
      <div class="seg" id="mode">
        <button type="button" data-v="all">Everyone</button>
        <button type="button" data-v="following">Following</button>
      </div>
    </div>
  </div>
  <p class="hint" id="modeHint">Public live makers and the shared calendar. No API key needed.</p>

  <h2>API key</h2>
  <div class="group">
    <div class="row">
      <label class="field">
        <span>From your MakersOnStream account</span>
        <input id="apiKey" type="password" autocomplete="off" placeholder="Paste API key" spellcheck="false">
      </label>
    </div>
  </div>
  <p class="hint">Needed for <strong>Following</strong>. Get it at <a href="https://makersonstream.app/account" target="_blank" rel="noopener">makersonstream.app/account</a>.</p>

  <h2>Upcoming window</h2>
  <div class="group">
    <div class="row">
      <div class="seg" id="days">
        <button type="button" data-v="1">1 day</button>
        <button type="button" data-v="2">2 days</button>
        <button type="button" data-v="3">3 days</button>
      </div>
    </div>
  </div>
</div>

<div class="bar">
  <button type="button" class="save" id="save">Save</button>
</div>

<script>
var RETURN_TO = "__RETURN_TO__";
var state = "__MOS_STATE__";
if (typeof state === "string") {
  try { state = JSON.parse(state); } catch (e) { state = {}; }
}
state = Object.assign({ apiKey: "", mode: "all", days: 2 }, state || {});

function setSeg(id, value) {
  var root = document.getElementById(id);
  Array.prototype.forEach.call(root.querySelectorAll("button"), function (btn) {
    btn.classList.toggle("on", String(btn.getAttribute("data-v")) === String(value));
  });
}

function bindSeg(id, onChange) {
  document.getElementById(id).addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-v]");
    if (!btn) return;
    onChange(btn.getAttribute("data-v"));
  });
}

function updateModeHint() {
  var el = document.getElementById("modeHint");
  el.textContent = state.mode === "following"
    ? "Only makers you follow — requires your API key."
    : "Public live makers and the shared calendar. No API key needed.";
}

document.getElementById("apiKey").value = state.apiKey || "";
setSeg("mode", state.mode);
setSeg("days", state.days);
updateModeHint();

bindSeg("mode", function (v) {
  state.mode = v;
  setSeg("mode", v);
  updateModeHint();
});
bindSeg("days", function (v) {
  state.days = parseInt(v, 10);
  setSeg("days", state.days);
});

document.getElementById("save").addEventListener("click", function () {
  state.apiKey = document.getElementById("apiKey").value.trim();
  var payload = JSON.stringify({
    apiKey: state.apiKey,
    mode: state.mode,
    days: state.days
  });
  window.location.href = RETURN_TO + encodeURIComponent(payload);
});
</script>
</body>
</html>
